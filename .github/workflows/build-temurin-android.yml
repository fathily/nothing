name: Build Android ARM64 Java runtimes for NUX

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-temurin-android.yml"

permissions:
  contents: read

jobs:
  build-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: "8"
            branch: "Build_JRE_8"
            runner: "ubuntu-22.04"
            boot: "7"
            boot_distribution: "zulu"
          - java: "17"
            branch: "Build_JRE_17"
            runner: "ubuntu-22.04"
            boot: "17"
            boot_distribution: "temurin"
          - java: "21"
            branch: "Build_JRE_21"
            runner: "ubuntu-latest"
            boot: ""
            boot_distribution: ""
          - java: "25"
            branch: "Build_JRE_25"
            runner: "ubuntu-latest"
            boot: ""
            boot_distribution: ""

    name: "Android ARM64 Java ${{ matrix.java }}"
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Android OpenJDK builder
        uses: actions/checkout@v4
        with:
          repository: FCL-Team/Android-OpenJDK-Build
          ref: ${{ matrix.branch }}

      - name: Set up boot JDK
        if: matrix.boot != ''
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.boot_distribution }}
          java-version: ${{ matrix.boot }}

      - name: Download required boot JDK for Java 21/25
        if: matrix.java == '21' || matrix.java == '25'
        shell: bash
        run: bash get_boot_jdk.sh

      - name: Build Android ARM64 runtime
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ci_build_arch_aarch64.sh
          bash ci_build_arch_aarch64.sh

      - name: Verify Android ARM64 runtime
        shell: bash
        run: |
          set -euxo pipefail

          archive="$(find . -maxdepth 1 -type f -name 'jre${{ matrix.java }}-arm64-*.tar.xz' | head -n1)"
          test -n "$archive"

          rm -rf verify
          mkdir verify
          tar -xJf "$archive" -C verify

          test -x verify/bin/java
          test -f verify/lib/libjli.so
          test -f verify/lib/server/libjvm.so

          if [ "${{ matrix.java }}" = "8" ]; then
            test -f verify/jre/lib/rt.jar || test -f verify/lib/rt.jar
          else
            test -f verify/lib/modules
          fi

          file verify/bin/java
          readelf -h verify/bin/java | grep -E 'Class:.*ELF64|Machine:.*AArch64'

          for so in verify/lib/libjli.so verify/lib/server/libjvm.so; do
            file "$so"
            readelf -h "$so" | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          done

          mkdir -p "$GITHUB_WORKSPACE/runtime/temurin-${{ matrix.java }}"
          cp "$archive" "$GITHUB_WORKSPACE/runtime/temurin-${{ matrix.java }}/universal.tar.xz"
          printf '%s\n' "Android ARM64 OpenJDK ${{ matrix.java }} runtime (FCL Android build)" > "$GITHUB_WORKSPACE/runtime/temurin-${{ matrix.java }}/version"

      - name: Upload Android ARM64 runtime
        uses: actions/upload-artifact@v4
        with:
          name: temurin-${{ matrix.java }}-arm64
          path: runtime/temurin-${{ matrix.java }}

  package-apk:
    needs: build-runtime
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout launcher
        uses: actions/checkout@v4

      - name: Download Java 8
        uses: actions/download-artifact@v4
        with:
          name: temurin-8-arm64
          path: app/src/main/assets/runtimes/temurin-8

      - name: Download Java 17
        uses: actions/download-artifact@v4
        with:
          name: temurin-17-arm64
          path: app/src/main/assets/runtimes/temurin-17

      - name: Download Java 21
        uses: actions/download-artifact@v4
        with:
          name: temurin-21-arm64
          path: app/src/main/assets/runtimes/temurin-21

      - name: Download Java 25
        uses: actions/download-artifact@v4
        with:
          name: temurin-25-arm64
          path: app/src/main/assets/runtimes/temurin-25

      - name: Verify runtime assets
        shell: bash
        run: |
          set -euxo pipefail
          for r in 8 17 21 25; do
            test -s "app/src/main/assets/runtimes/temurin-$r/universal.tar.xz"
            tar -tJf "app/src/main/assets/runtimes/temurin-$r/universal.tar.xz" | grep -E '^\./?bin/java$|^bin/java$'
            tar -tJf "app/src/main/assets/runtimes/temurin-$r/universal.tar.xz" | grep 'lib/libjli.so'
            tar -tJf "app/src/main/assets/runtimes/temurin-$r/universal.tar.xz" | grep 'lib/server/libjvm.so'
          done

      - name: Verify NUX runtimes are untouched
        shell: bash
        run: |
          set -euxo pipefail
          for r in jre-8 jre-17 jre-21 jre-25; do
            test -d "app/src/main/assets/runtimes/$r"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build debug APK with Android ARM64 runtimes
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nux-launcher-debug-with-android-arm64-java-8-17-21-25
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
