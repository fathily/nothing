name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed Update APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare signing key
        env:
          NUX_KEYSTORE_B64: ${{ secrets.NUX_KEYSTORE_B64 }}
        run: |
          if [ -z "$NUX_KEYSTORE_B64" ]; then
            echo "Missing NUX_KEYSTORE_B64 repository secret."
            echo "Add the persistent NUX signing keystore as a GitHub Actions secret."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$NUX_KEYSTORE_B64" | base64 --decode > signing/nux-release.jks
          chmod 600 signing/nux-release.jks

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build signed update APK
        env:
          NUX_KEYSTORE_PASSWORD: ${{ secrets.NUX_KEYSTORE_PASSWORD }}
          NUX_KEY_ALIAS: ${{ secrets.NUX_KEY_ALIAS }}
          NUX_KEY_PASSWORD: ${{ secrets.NUX_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload update APK
        uses: actions/upload-artifact@v4
        with:
          name: nux-launcher-update-v1.0.9
          path: "app/build/outputs/apk/release/*.apk"
          if-no-files-found: error
