name: NUX APK Releases

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.1.4"
        required: true
        type: string
      channel:
        description: "Stable release or ARM test prerelease"
        required: true
        type: choice
        options:
          - stable
          - prerelease
          - both

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || '1.1.4' }}
  CHANNEL: ${{ inputs.channel || 'both' }}

concurrency:
  group: nux-apk-releases
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.abi }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [universal, arm64, arm32]
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate version
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

      - name: Build APK
        env:
          APP_VERSION_NAME: ${{ env.VERSION }}
          APP_VERSION_CODE: ${{ 1000 + github.run_number }}
          APK_ABI: ${{ matrix.abi }}
          NUX_SERVER_URL: ${{ secrets.NUX_SERVER_URL || vars.NUX_SERVER_URL }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/NUX-${{ env.VERSION }}-${{ matrix.abi }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NUX-${{ env.VERSION }}-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  publish-stable:
    name: Publish stable Release
    if: env.CHANNEL == 'stable' || env.CHANNEL == 'both'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download universal APK
        uses: actions/download-artifact@v4
        with:
          name: NUX-${{ env.VERSION }}-universal
          path: dist

      - name: Publish stable Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
        run: |
          gh release create "v$VERSION" dist/NUX-"$VERSION"-universal.apk \
            --title "NUX Launcher $VERSION" \
            --notes "Stable universal APK release." \
            --latest

  publish-prerelease:
    name: Publish ARM test Pre-release
    if: env.CHANNEL == 'prerelease' || env.CHANNEL == 'both'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all ABI APKs
        uses: actions/download-artifact@v4
        with:
          pattern: NUX-${{ env.VERSION }}-*
          path: dist
          merge-multiple: true

      - name: Publish Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
        run: |
          gh release create "v$VERSION-arm-test" dist/*.apk \
            --title "NUX Launcher $VERSION — ARM test builds" \
            --notes "Testing builds: ARM32 (armeabi-v7a), ARM64 (arm64-v8a), and universal." \
            --prerelease
