name: NUX 1.1.4 Releases

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nux-114-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.abi }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [universal, arm64, arm32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        env:
          APP_VERSION_NAME: "1.1.4"
          APP_VERSION_CODE: ${{ 1104 + github.run_attempt }}
          APK_ABI: ${{ matrix.abi }}
          NUX_SERVER_URL: ${{ secrets.NUX_SERVER_URL || vars.NUX_SERVER_URL }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/NUX-1.1.4-${{ matrix.abi }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: NUX-1.1.4-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  publish-stable:
    name: Publish original NUX stable Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NUX-1.1.4-universal
          path: dist
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.4 >/dev/null 2>&1; then
            gh release upload v1.1.4 dist/NUX-1.1.4-universal.apk --clobber
          else
            gh release create v1.1.4 dist/NUX-1.1.4-universal.apk \
              --title "NUX Launcher 1.1.4" \
              --notes "Stable NUX Launcher release. Universal APK."
          fi

  publish-prerelease:
    name: Publish mixed ARM32 ARM64 Universal Pre-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: NUX-1.1.4-*
          path: dist
          merge-multiple: true
      - name: Publish ARM test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.4-arm-test >/dev/null 2>&1; then
            gh release upload v1.1.4-arm-test dist/*.apk --clobber
          else
            gh release create v1.1.4-arm-test dist/*.apk \
              --title "NUX Launcher 1.1.4 — ARM32 / ARM64 / Universal" \
              --notes "Mixed fork testing build: Universal, ARM64 (arm64-v8a), and ARM32 (armeabi-v7a). Debug-signed if release signing secrets are not configured. Back up app data before installing over another signed build." \
              --prerelease
          fi
