name: Port MobileGlues renderer to ARM32

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/port-mobileglues-arm32.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm32-renderer:
    name: Build and verify MobileGlues armeabi-v7a
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout MobileGlues source and submodules
        uses: actions/checkout@v4
        with:
          repository: MobileGL-Dev/MobileGlues
          ref: main
          submodules: recursive
          path: mobileglues

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install CMake and NDK
        run: |
          set -euxo pipefail
          sdkmanager "cmake;3.22.1" "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Build MobileGlues for 32-bit ARM
        working-directory: mobileglues
        run: |
          set -euxo pipefail
          test -f MobileGlues-cpp/CMakeLists.txt
          test -d MobileGlues-cpp/3rdparty/glslang
          test -d MobileGlues-cpp/3rdparty/SPIRV-Cross
          cmake -S MobileGlues-cpp -B build-arm32 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm32 --config Release --parallel 2

      - name: Verify renderer ELF architecture and dependencies
        working-directory: mobileglues
        run: |
          set -euxo pipefail
          LIB="$(find build-arm32 -type f -name 'libmobileglues.so' -print -quit)"
          test -n "$LIB"
          file "$LIB"
          readelf -h "$LIB" | grep -E 'Class:.*ELF32|Machine:.*ARM'
          ! readelf -d "$LIB" | grep -q 'libc.so.6'
          mkdir -p "$GITHUB_WORKSPACE/out/armeabi-v7a"
          cp "$LIB" "$GITHUB_WORKSPACE/out/armeabi-v7a/libmobileglues.so"
          cp "$GITHUB_WORKSPACE/mobileglues/LICENSE" "$GITHUB_WORKSPACE/out/MobileGlues-LICENSE"
          printf '%s\n' "MobileGlues source: MobileGL-Dev/MobileGlues@main" "Target ABI: armeabi-v7a" "Android API: 26" > "$GITHUB_WORKSPACE/out/BUILD-INFO.txt"

      - name: Upload ARM32 renderer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobileglues-arm32-native
          path: out/

  package-arm32-apk:
    name: Package ARM32 test APK
    needs: build-arm32-renderer
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout NUX fork
        uses: actions/checkout@v4
        with:
          repository: fathily/nothing
          ref: main

      - name: Download ARM32 renderer
        uses: actions/download-artifact@v4
        with:
          name: mobileglues-arm32-native
          path: ported-renderer

      - name: Install verified ARM32 renderer
        run: |
          set -euxo pipefail
          test -s ported-renderer/armeabi-v7a/libmobileglues.so
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cp ported-renderer/armeabi-v7a/libmobileglues.so app/src/main/jniLibs/armeabi-v7a/libmobileglues.so
          file app/src/main/jniLibs/armeabi-v7a/libmobileglues.so
          readelf -h app/src/main/jniLibs/armeabi-v7a/libmobileglues.so | grep -E 'Class:.*ELF32|Machine:.*ARM'
          test -s app/src/main/jniLibs/armeabi-v7a/libmobileglues_info_getter.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build ARM32-capable debug APK
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify "$APK"
          unzip -l "$APK" | grep 'lib/armeabi-v7a/libmobileglues.so'
          unzip -p "$APK" lib/armeabi-v7a/libmobileglues.so > /tmp/libmobileglues.so
          readelf -h /tmp/libmobileglues.so | grep -E 'Class:.*ELF32|Machine:.*ARM'
          cp "$APK" NUX-ARM32-MobileGlues-test.apk

      - name: Upload ARM32 test APK
        uses: actions/upload-artifact@v4
        with:
          name: nux-arm32-mobileglues-test-apk
          path: NUX-ARM32-MobileGlues-test.apk
