name: Port MobileGlues renderer to ARM32

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/port-mobileglues-arm32.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm32-renderer:
    name: Build and verify MobileGlues armeabi-v7a
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout MobileGlues source and submodules
        uses: actions/checkout@v4
        with:
          repository: MobileGL-Dev/MobileGlues
          ref: main
          submodules: recursive
          path: mobileglues

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android CMake and NDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "cmake;3.22.1" "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Build MobileGlues for 32-bit ARM
        working-directory: mobileglues
        run: |
          set -euxo pipefail
          test -f MobileGlues-cpp/CMakeLists.txt
          test -d MobileGlues-cpp/3rdparty/glslang
          test -d MobileGlues-cpp/3rdparty/SPIRV-Cross
          cmake -S MobileGlues-cpp -B build-arm32 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm32 --config Release --parallel 2

      - name: Verify renderer ELF architecture and dependencies
        working-directory: mobileglues
        run: |
          set -euxo pipefail
          LIB="$(find build-arm32 -type f -name 'libmobileglues.so' -print -quit)"
          test -n "$LIB"
          file "$LIB"
          readelf -h "$LIB" | grep -E 'Class:.*ELF32|Machine:.*ARM'
          ! readelf -d "$LIB" | grep -q 'libc.so.6'
          mkdir -p "$GITHUB_WORKSPACE/out/armeabi-v7a"
          cp "$LIB" "$GITHUB_WORKSPACE/out/armeabi-v7a/libmobileglues.so"
          cp "$GITHUB_WORKSPACE/mobileglues/LICENSE" "$GITHUB_WORKSPACE/out/MobileGlues-LICENSE"
          printf '%s\n' "MobileGlues source: MobileGL-Dev/MobileGlues@main" "Target ABI: armeabi-v7a" "Android API: 26" > "$GITHUB_WORKSPACE/out/BUILD-INFO.txt"

      - name: Upload ARM32 renderer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobileglues-arm32-native
          path: out/
          if-no-files-found: error

  package-and-publish:
    name: Build APK variants and publish prerelease
    needs: build-arm32-renderer
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout NUX fork
        uses: actions/checkout@v4
        with:
          repository: fathily/nothing
          ref: main

      - name: Download ARM32 renderer
        uses: actions/download-artifact@v4
        with:
          name: mobileglues-arm32-native
          path: ported-renderer

      - name: Install verified ARM32 renderer
        run: |
          set -euxo pipefail
          test -s ported-renderer/armeabi-v7a/libmobileglues.so
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cp ported-renderer/armeabi-v7a/libmobileglues.so app/src/main/jniLibs/armeabi-v7a/libmobileglues.so
          file app/src/main/jniLibs/armeabi-v7a/libmobileglues.so
          readelf -h app/src/main/jniLibs/armeabi-v7a/libmobileglues.so | grep -E 'Class:.*ELF32|Machine:.*ARM'
          test -s app/src/main/jniLibs/armeabi-v7a/libmobileglues_info_getter.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build universal, ARM64, and ARM32 APKs
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          mkdir -p release-files
          GRADLE_FILE="app/build.gradle.kts"
          cp "$GRADLE_FILE" /tmp/build.gradle.kts.original

          restore_gradle() {
            cp /tmp/build.gradle.kts.original "$GRADLE_FILE"
          }
          trap restore_gradle EXIT

          build_variant() {
            local label="$1"
            local abi_list="$2"
            python3 - "$GRADLE_FILE" "$abi_list" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          abi_list = sys.argv[2]
          text = path.read_text()
          old = 'abiFilters.addAll(listOf("arm64-v8a", "armeabi-v7a", "x86", "x86_64"))'
          new = f'abiFilters.addAll(listOf({abi_list}))'
          if text.count(old) != 1:
              raise SystemExit("Could not safely locate the ABI filter line")
          path.write_text(text.replace(old, new, 1))
          PY
            ./gradlew clean assembleDebug --stacktrace --no-daemon
            local apk="app/build/outputs/apk/debug/app-debug.apk"
            test -s "$apk"
            local apksigner
            apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            "$apksigner" verify "$apk"
            cp "$apk" "release-files/$label.apk"
          }

          build_variant "apk-universal" '"arm64-v8a", "armeabi-v7a", "x86", "x86_64"'
          build_variant "apk-arm64" '"arm64-v8a"'
          build_variant "apk-armeabi32" '"armeabi-v7a"'
          restore_gradle
          trap - EXIT

          unzip -l release-files/apk-universal.apk | grep 'lib/armeabi-v7a/libmobileglues.so'
          unzip -l release-files/apk-arm64.apk | grep 'lib/arm64-v8a/'
          unzip -l release-files/apk-armeabi32.apk | grep 'lib/armeabi-v7a/libmobileglues.so'
          ! unzip -l release-files/apk-armeabi32.apk | grep -q 'lib/arm64-v8a/'
          cp ported-renderer/armeabi-v7a/libmobileglues.so release-files/libmobileglues-arm32.so
          cp ported-renderer/MobileGlues-LICENSE release-files/MobileGlues-LICENSE
          cp ported-renderer/BUILD-INFO.txt release-files/ARM32-BUILD-INFO.txt
          cd release-files
          zip -r mobileglues-port.zip libmobileglues-arm32.so MobileGlues-LICENSE ARM32-BUILD-INFO.txt
          sha256sum apk-universal.apk apk-arm64.apk apk-armeabi32.apk mobileglues-port.zip > SHA256SUMS.txt

      - name: Publish GitHub prerelease with changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="v1.1.3-arm32-test.1"
          cat > release-notes.md <<'EOF'
          ## NUX Launcher — MobileGlues ARM32 test build

          ### Changelog
          - Added a MobileGlues renderer build for Android `armeabi-v7a` (32-bit ARM).
          - Packaged the newly built `libmobileglues.so` into the ARM32 APK.
          - Produced separate universal, ARM64-only, and ARM32-only debug APKs.
          - Included the MobileGlues port bundle, license, build information, and SHA-256 checksums.

          ### Download files
          - `apk-universal.apk` — APK containing supported ABIs.
          - `apk-arm64.apk` — APK for 64-bit ARM devices.
          - `apk-armeabi32.apk` — APK for 32-bit ARM devices.
          - `mobileglues-port.zip` — ARM32 MobileGlues library, license, and build info.
          - `MobileGlues-LICENSE` — upstream license.
          - `ARM32-BUILD-INFO.txt` — build target information.
          - `SHA256SUMS.txt` — checksums for APKs and port bundle.

          ### Important test status
          - CI compilation, APK packaging, APK signature checks, and ABI contents checks must pass before publication.
          - Minecraft has not yet been tested on a real ARM32 device; successful launch and rendering are not guaranteed.
          - This is a prerelease/test build, not a stable release.
          - APKs are debug-signed. If Android reports a signature conflict, do not uninstall until launcher/game data is backed up.
          EOF

          if gh release view "$TAG" --repo fathily/nothing >/dev/null 2>&1; then
            gh release upload "$TAG" release-files/apk-universal.apk release-files/apk-arm64.apk release-files/apk-armeabi32.apk release-files/mobileglues-port.zip release-files/MobileGlues-LICENSE release-files/ARM32-BUILD-INFO.txt release-files/SHA256SUMS.txt --clobber --repo fathily/nothing
            gh release edit "$TAG" --title "NUX Launcher — MobileGlues ARM32 Test" --notes-file release-notes.md --prerelease --repo fathily/nothing
          else
            gh release create "$TAG" release-files/apk-universal.apk release-files/apk-arm64.apk release-files/apk-armeabi32.apk release-files/mobileglues-port.zip release-files/MobileGlues-LICENSE release-files/ARM32-BUILD-INFO.txt release-files/SHA256SUMS.txt --target "$GITHUB_SHA" --title "NUX Launcher — MobileGlues ARM32 Test" --notes-file release-notes.md --prerelease --repo fathily/nothing
          fi
