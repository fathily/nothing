name: Signed NUX Fork Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 1.1.4)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: signed-nux-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "::error::Set ANDROID_KEYSTORE_BASE64 in repository Actions secrets. A persistent signing key is required for in-place app updates."; exit 1)
          test -n "$STORE_PASSWORD" || (echo "::error::Set ANDROID_KEYSTORE_PASSWORD in repository Actions secrets."; exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Set ANDROID_KEY_ALIAS in repository Actions secrets."; exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Set ANDROID_KEY_PASSWORD in repository Actions secrets."; exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key and server configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NUX_SERVER_URL: ${{ secrets.NUX_SERVER_URL || vars.NUX_SERVER_URL }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "NUX_SERVER_URL=$NUX_SERVER_URL" >> "$GITHUB_ENV"
          if [ -z "$NUX_SERVER_URL" ]; then
            echo "::warning::NUX_SERVER_URL is not configured. The APK can build, but NUX backend features such as login/server-backed voice token requests will not connect."
          fi

      - name: Build signed release APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ 1000 + github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Rename release APK
        run: cp app/build/outputs/apk/release/app-release.apk "NUX-Fork-${{ steps.version.outputs.name }}-universal.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.version.outputs.tag }}" "NUX-Fork-${{ steps.version.outputs.name }}-universal.apk" --clobber
          else
            gh release create "${{ steps.version.outputs.tag }}" "NUX-Fork-${{ steps.version.outputs.name }}-universal.apk" \
              --title "NUX Fork ${{ steps.version.outputs.name }}" \
              --notes "Signed Android release build. Install over the previous fork version; keep the same signing key for future updates."
          fi
