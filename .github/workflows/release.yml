name: Release APK

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.9"
        required: true
        default: "v1.0.9"

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed release APK
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v1.0.10' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref_name }}

      - name: Check release signing secrets
        shell: bash
        run: |
          if [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && [ -n "${ANDROID_KEY_ALIAS}" ] && [ -n "${ANDROID_KEY_PASSWORD}" ] && [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "RELEASE_SIGNING=stable" >> "$GITHUB_ENV"
            echo "Using stable release signing key."
          else
            echo "RELEASE_SIGNING=debug" >> "$GITHUB_ENV"
            echo "::warning::Stable release signing secrets are not configured. Building with the generated debug signing key so the APK can still be produced."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode release keystore
        if: env.RELEASE_SIGNING == 'stable'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${ANDROID_KEYSTORE_PATH}"
          chmod 600 "${ANDROID_KEYSTORE_PATH}"
          test -s "${ANDROID_KEYSTORE_PATH}"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure fallback signing
        if: env.RELEASE_SIGNING == 'debug'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          needle = '''            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.getByName("release")
            }
'''
          repl = '''            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.getByName("release")
            } else {
                signingConfig = signingConfigs.getByName("debug")
            }
'''
          if needle not in s:
              raise SystemExit("release signing block not found")
          p.write_text(s.replace(needle, repl, 1))
          PY

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify APK was signed
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK" | head -40

      - name: Prepare release APK
        run: cp app/build/outputs/apk/release/app-release.apk "NuxLauncher-${RELEASE_TAG}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${RELEASE_SIGNING}" = "debug" ]; then
            SIGNING_NOTE='- Temporary debug signing is used because stable release signing secrets are not configured.'
          else
            SIGNING_NOTE='- Stable fork release signing key is used.'
          fi
          printf '%s\n' '## NUX Launcher v1.0.10' '' '### What is New' '- Added AI Crash Analyst integration.' '- VIP accounts now have unlimited AI Crash Analyst usage.' '- Free accounts keep the 5 analyses/day limit.' '- Personal AI API keys remain unlimited.' '- Added streaming AI crash-analysis support.' '- Improved release signing and publishing workflow.' "${SIGNING_NOTE}" '' '### Notes' '- VIP unlimited applies to the app local daily quota.' '- AI providers may still enforce their own rate limits.' > release-notes.md
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "NuxLauncher-${RELEASE_TAG}.apk" --clobber
            gh release edit "${RELEASE_TAG}" --title "NUX Launcher ${RELEASE_TAG}" --notes-file release-notes.md
          else
            gh release create "${RELEASE_TAG}" "NuxLauncher-${RELEASE_TAG}.apk" --target "${GITHUB_SHA}" --title "NUX Launcher ${RELEASE_TAG}" --notes-file release-notes.md
          fi

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${ANDROID_KEYSTORE_PATH}"
