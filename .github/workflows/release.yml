name: Release APK

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish v1.0.11
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK" | head -40
          cp "$APK" "NuxLauncher-v1.0.11.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cat > release-notes.md <<'EOF'
          ## NUX Launcher v1.0.11

          ### What's changed
          - Fixed virtual controls alignment with the Minecraft game viewport.
          - Synced Custom GUI editor positioning with in-game controls.
          - Restored Java runtime selector: AUTO, Java 8, Java 17, Java 21, and Java 25.
          - Global Java selection now takes priority for all instances.
          - Fixed AI Crash Analyst free-model routing.
          - Updated fork version checking to use this GitHub fork's Releases.

          ### Compatibility
          - Work for Voxy (maybe, cuz idk) 🗿 — not tested; compatibility is not guaranteed.
          - Java runtime availability and Minecraft/mod compatibility still depend on the selected version.

          ### Install note
          - This build uses the GitHub Actions debug signing key because stable release signing secrets are not configured. If Android reports a signature conflict, the existing app may need to be removed before installing this APK; back up launcher/game data first.
          EOF

          if gh release view v1.0.11 >/dev/null 2>&1; then
            gh release upload v1.0.11 NuxLauncher-v1.0.11.apk --clobber
            gh release edit v1.0.11 --title "NUX Launcher v1.0.11" --notes-file release-notes.md
          else
            gh release create v1.0.11 NuxLauncher-v1.0.11.apk               --target "$GITHUB_SHA"               --title "NUX Launcher v1.0.11"               --notes-file release-notes.md
          fi
